<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Contato - Agenda</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        div { margin-bottom: 10px; }
        label { display: block; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a, .btn-link { text-decoration: none; color: #007bff; font-weight: bold; margin-right: 15px; }
        .btn-cancelar { color: #dc3545; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <!-- NAVEGAÇÃO NO TOPO -->
    <div class="nav-links">
        <a href="/">🏠 Início</a>
        <a href="/listar.html">📋 Ver Lista de Contatos</a>
    </div>

    <h1>Novo Contato</h1>
    <form id="formContato">
        <div><label>Nome:</label> <input type="text" id="nome" required></div>
        <div><label>Email:</label> <input type="email" id="email" required></div>
        <div><label>Telefone:</label> <input type="text" id="telefone" required></div>
        <div><label>Data de Nascimento:</label> <input type="date" id="data_nascimento" required></div>

        <hr>
        <h3>Endereço</h3>
        <div><label>CEP:</label> <input type="text" id="cep" required placeholder="Digite o CEP e saia do campo"></div>
        <div><label>Logradouro:</label> <input type="text" id="logradouro" required></div>
        <div><label>Número:</label> <input type="text" id="numero" required></div>
        <div><label>Complemento:</label> <input type="text" id="complemento"></div>
        <div><label>Bairro:</label> <input type="text" id="bairro" required></div>
        <div><label>Cidade:</label> <input type="text" id="cidade" readonly></div>
        <div><label>Estado (UF):</label> <input type="text" id="estado" readonly></div>

        <!-- BOTÕES DE AÇÃO -->
        <button type="submit">Salvar Contato</button>
        <a href="/listar.html" class="btn-cancelar">Cancelar / Ver Lista</a>
        <a href="/" style="margin-left: 10px; text-decoration: none; color: #6c757d;">Menu Inicial</a>
    </form>

    <script>
        // ViaCEP
        document.getElementById('cep').addEventListener('blur', async (e) => {
            const cep = e.target.value.replace(/\D/g, '');
            if (cep.length === 8) {
                try {
                    const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await res.json();
                    if (!data.erro) {
                        document.getElementById('logradouro').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('estado').value = data.uf;
                        document.getElementById('numero').focus();
                    } else {
                        alert("CEP não encontrado!");
                    }
                } catch (err) {
                    alert("Erro ao buscar o CEP.");
                }
            }
        });

        // Envio do formulário
        document.getElementById('formContato').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                cep: document.getElementById('cep').value,
                logradouro: document.getElementById('logradouro').value,
                numero: document.getElementById('numero').value,
                complemento: document.getElementById('complemento').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value
            };

            const res = await fetch('/api/contatos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('Contato salvo com sucesso!');
                window.location.href = '/listar.html';
            } else {
                alert('Erro ao salvar o contato.');
            }
        });
    </script>
</body>
</html>
