<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contatos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { cursor: pointer; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
        .btn-home { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="btn-home">🏠 Menu Inicial</a>
        <a href="/cadastrar.html" class="btn-add">+ Adicionar Novo Contato</a>
    </div>

    <h1>Agenda de Contatos Cadastrados</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Nascimento</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
    </table>

    <script>
        async function carregarContatos() {
            const res = await fetch('/api/contatos');
            const contatos = await res.json();
            const tbody = document.getElementById('tabelaCorpo');
            tbody.innerHTML = '';

            if (contatos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Nenhum contato cadastrado.</td></tr>';
                return;
            }

            contatos.forEach(c => {
                const dataFmt = c.data_nascimento ? c.data_nascimento.split('-').reverse().join('/') : '';

                tbody.innerHTML += `
                    <tr>
                        <td>${c.id}</td>
                        <td>${c.nome}</td>
                        <td>${c.email}</td>
                        <td>${c.telefone}</td>
                        <td>${dataFmt}</td>
                        <td>${c.cidade}/${c.estado}</td>
                        <td>
                            <button onclick="editar(${c.id})">Editar</button>
                            <button onclick="deletar(${c.id})" style="color: red;">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editar(id) {
            window.location.href = `/editar.html?id=${id}`;
        }

        async function deletar(id) {
            if (confirm('Deseja realmente remover este contato?')) {
                await fetch(`/api/contatos?id=${id}`, { method: 'DELETE' });
                carregarContatos();
            }
        }

        carregarContatos();
    </script>
</body>
</html>
